name: Release

on:
  push:
    tags:
      - "v*.*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Testar e gerar executável
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Validar tag e versão
        run: python scripts/verify_release.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Gerar executável
        shell: pwsh
        run: ./build_exe.ps1
      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: petronect-email-extractor-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar executável validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: petronect-email-extractor-${{ github.ref_name }}
          path: dist
      - name: Criar release e anexar executável
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.exe
          --verify-tag
          --generate-notes
          --title "Petronect Email Extractor ${GITHUB_REF_NAME}"
